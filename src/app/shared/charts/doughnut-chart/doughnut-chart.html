<section class="chart-card">
  <header class="chart-header">
    <div class="header-text">
      <div class="title-row">
        <h3 class="chart-title">{{ title() }}</h3>
      </div>
    </div>
  </header>

  <div class="chart-container doughnut-container">

    <!-- Main chart content -->
    <div
      class="doughnut-content-wrap"
      [class.dimmed]="isLoading() || hasError() || isEmpty()"
    >
      <div class="doughnut-plot-wrap">
        <canvas #chartCanvas></canvas>
      </div>
    </div>

    <!-- Loading state -->
    @if (isLoading()) {
      <div
        class="chart-loading-state"
        aria-hidden="true"
      >
        <div class="doughnut-skeleton"></div>

        <span class="skeleton-line wide"></span>

        <span class="skeleton-line medium"></span>
      </div>
    }

    <!-- Error state -->
    @else if (hasError()) {
      <div class="chart-error-state">
        <div
          class="error-icon"
          aria-hidden="true"
        >
          !
        </div>

        <p>We couldn't load the chart right now.</p>

        <small>Please refresh and try again.</small>

        <button
          class="retry-btn"
          type="button"
          (click)="onRetry()"
        >
          Retry
        </button>
      </div>
    }

    <!-- Empty state -->
    @else if (isEmpty()) {
      <div class="chart-empty-state">
        <div class="empty-icon-wrap">
          <i
            class="fa-solid fa-chart-pie"
            aria-hidden="true"
          ></i>
        </div>

        <p>No spending data found.</p>

        <small>
          Add expenses to see your category breakdown.
        </small>
      </div>
    }

  </div>
</section>
