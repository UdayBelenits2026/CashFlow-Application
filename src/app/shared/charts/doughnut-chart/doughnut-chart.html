<section class="chart-card">
  <header>
    <h3>{{ title() }}</h3>
  </header>
  <div class="chart-container doughnut-container">
    <div class="doughnut-center">
      <small>Total</small>
      <span>{{ total() | currency: 'USD' : 'symbol' : '1.2-2' }}</span>
    </div>
    <canvas #chartCanvas></canvas>
  </div>
</section>
