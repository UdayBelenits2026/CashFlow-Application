<section class="chart-card">
  <header>
    <h3>{{ title() }}</h3>
  </header>
  <div class="chart-container doughnut-container">
    <div class="doughnut-content-wrap" [class.dimmed]="isLoading() || hasError()">
      <div class="doughnut-plot-wrap">
        <canvas #chartCanvas></canvas>
        <div class="doughnut-center" [class.hidden]="isLoading() || hasError()">
          <small>Total</small>
          <span>{{ total() | currency: 'USD' : 'symbol' : '1.2-2' }}</span>
        </div>
      </div>
      <ul class="doughnut-legend" [class.hidden]="isLoading() || hasError()">
        @for (label of labels(); track label; let i = $index) {
          <li>
            <span class="swatch" [style.background-color]="legendColor(i)"></span>
            <span>{{ label }}</span>
          </li>
        }
      </ul>
    </div>
    @if (isLoading()) {
      <div class="chart-loading-state" aria-hidden="true">
        <div class="doughnut-skeleton"></div>
        <span class="skeleton-line wide"></span>
        <span class="skeleton-line medium"></span>
      </div>
    } @else if (hasError()) {
      <div class="chart-error-state">
        <div class="error-icon">!</div>
        <p>We couldn't load the chart right now.</p>
        <small>Please refresh and try again.</small>
        <button class="retry-btn" type="button" (click)="onRetry()">Retry</button>
      </div>
    }
  </div>
</section>
