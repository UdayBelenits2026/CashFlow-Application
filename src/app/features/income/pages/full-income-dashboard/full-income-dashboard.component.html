<div class="income-dashboard-page">
  <!-- Header -->
  <div class="top-bar">
    <div class="title-wrap">
      <h1 class="page-title">Income Dashboard</h1>
      <p class="page-subtitle">Manage upcoming scheduled inflows and verify recently received payments</p>
    </div>

    <div class="action-buttons">
      <button type="button" class="btn-secondary" (click)="showSourceModal = true">
        + New Source
      </button>
      <button type="button" class="btn-primary" (click)="activeIncome = null; showAddModal = true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Record Income
      </button>
    </div>
  </div>

  <!-- KPI Cards -->
  <app-income-kpi-cards [overview]="overview$ | async"></app-income-kpi-cards>

  <!-- Split Operational Layout: Upcoming Schedules vs Recent Transactions -->
  <div class="dashboard-split">
    <!-- Left: Upcoming Expected Income -->
    <div class="split-column">
      <app-upcoming-income
        [upcomingItems]="(upcomingIncomes$ | async) || []"
        (recordIncome)="onRecordRecurring($event)"
      ></app-upcoming-income>
    </div>

    <!-- Right: Recent Recorded Receipts -->
    <div class="split-column">
      <app-recent-income
        [incomes]="(recentIncomes$ | async) || []"
        (selectIncome)="onIncomeSelected($event)"
        (editIncome)="openEditModal($event)"
        (deleteIncome)="openDeleteDialog($event)"
      ></app-recent-income>
    </div>
  </div>

  <!-- Drawers & Modals -->
  @if (showDetailsDrawer) {
    <app-income-details-drawer
      [income]="activeIncome"
      (close)="showDetailsDrawer = false"
      (edit)="openEditModal($event)"
      (delete)="openDeleteDialog($event)"
    ></app-income-details-drawer>
  }

  @if (showAddModal) {
    <app-add-income-modal
      [income]="activeIncome"
      [sources]="(sources$ | async) || []"
      [accounts]="(accounts$ | async) || []"
      (close)="showAddModal = false; activeIncome = null"
      (save)="onSaveIncome($event)"
      (update)="onUpdateIncome($event)"
    ></app-add-income-modal>
  }

  @if (showSourceModal) {
    <app-income-source-modal
      [accounts]="(accounts$ | async) || []"
      (close)="showSourceModal = false"
      (save)="onSaveSource($event)"
    ></app-income-source-modal>
  }

  @if (showDeleteDialog) {
    <app-income-delete-confirm-dialog
      [itemAmount]="activeIncome?.amount"
      [itemDescription]="activeIncome?.description"
      [itemDate]="activeIncome?.date"
      (close)="showDeleteDialog = false"
      (confirm)="onConfirmDelete()"
    ></app-income-delete-confirm-dialog>
  }
</div>
