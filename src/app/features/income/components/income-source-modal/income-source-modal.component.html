<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">{{ source() ? '✏️ Edit Income Source' : '+ Add New Income Source' }}</h2>
      <button class="btn-close" (click)="onClose()" title="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="sourceForm" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="form-group">
        <label class="form-label">Source Name *</label>
        <input
          type="text"
          class="form-input"
          placeholder="e.g. Acme Corp Salary, Freelance Development"
          formControlName="name"
        />
        @if (sourceForm.get('name')?.touched && sourceForm.get('name')?.errors?.['required']) {
          <span class="error-text">Source name is required.</span>
        }
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label">Source Category / Type *</label>
          <select class="form-input" formControlName="type">
            @for (opt of typeOptions; track opt.type) {
              <option [value]="opt.type">{{ opt.label }}</option>
            }
          </select>
        </div>

        <div class="form-group flex-1">
          <label class="form-label">Expected Frequency</label>
          <select class="form-input" formControlName="frequency">
            <option value="MONTHLY">Monthly</option>
            <option value="BI_WEEKLY">Bi-Weekly</option>
            <option value="WEEKLY">Weekly</option>
            <option value="QUARTERLY">Quarterly</option>
            <option value="ANNUALLY">Annually</option>
            <option value="IRREGULAR">Irregular / As Received</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label">Estimated / Baseline Amount (₹)</label>
          <input
            type="number"
            step="0.01"
            placeholder="0.00"
            class="form-input"
            formControlName="expectedAmount"
          />
        </div>

        <div class="form-group flex-1">
          <label class="form-label">Default Receiving Account</label>
          <select class="form-input" formControlName="accountId">
            @for (acc of accounts(); track acc.id) {
              <option [value]="acc.id">{{ acc.name }} (••••{{ acc.accountNumberLast4 }})</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description (Optional)</label>
        <textarea
          class="form-textarea"
          rows="2"
          placeholder="e.g. Employer details, client contact, or property address"
          formControlName="description"
        ></textarea>
      </div>

      <div class="form-row checkbox-row">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="taxable" />
          <span>Taxable Income Stream</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="isRecurring" />
          <span>Recurring Schedule Active</span>
        </label>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn-primary">
          {{ source() ? 'Save Changes' : 'Create Income Source' }}
        </button>
      </div>
    </form>
  </div>
</div>
