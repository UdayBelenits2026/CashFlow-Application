<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">{{ item() ? '✏️ Edit Recurring Schedule' : '+ Set Up Recurring Income' }}</h2>
      <button class="btn-close" (click)="onClose()" title="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="recurringForm" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="form-group">
        <label class="form-label">Income Source *</label>
        <select class="form-input" formControlName="incomeSourceId">
          @for (src of sources(); track src.id) {
            <option [value]="src.id">{{ src.name }} ({{ src.type }})</option>
          }
        </select>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label">Expected Amount (₹) *</label>
          <input
            type="number"
            step="0.01"
            placeholder="0.00"
            class="form-input"
            formControlName="expectedAmount"
          />
        </div>

        <div class="form-group flex-1">
          <label class="form-label">Frequency *</label>
          <select class="form-input" formControlName="frequency">
            <option value="WEEKLY">Weekly</option>
            <option value="BI_WEEKLY">Bi-Weekly</option>
            <option value="MONTHLY">Monthly</option>
            <option value="QUARTERLY">Quarterly</option>
            <option value="ANNUALLY">Annually</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Destination Bank Account *</label>
        <select class="form-input" formControlName="accountId">
          @for (acc of accounts(); track acc.id) {
            <option [value]="acc.id">{{ acc.name }} (••••{{ acc.accountNumberLast4 }})</option>
          }
        </select>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label class="form-label">Start Date *</label>
          <input type="date" class="form-input" formControlName="startDate" />
        </div>

        <div class="form-group flex-1">
          <label class="form-label">Next Expected Date *</label>
          <input type="date" class="form-input" formControlName="nextIncomeDate" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Notes (Optional)</label>
        <textarea
          class="form-textarea"
          rows="2"
          placeholder="Payroll or invoice cycle reference"
          formControlName="notes"
        ></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn-primary">
          {{ item() ? 'Save Schedule' : 'Create Recurring Schedule' }}
        </button>
      </div>
    </form>
  </div>
</div>
