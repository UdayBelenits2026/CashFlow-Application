@if ((error$ | async) && !(hasData$ | async)) {
  <app-spending-error-state (retry)="onRetry()"></app-spending-error-state>
} @else {
  @if (error$ | async; as err) {
    <div class="spending-error-toast" role="alert">
      <span>⚠️ {{ err }}</span>
      <button type="button" class="toast-close" (click)="dismissError()" aria-label="Dismiss">✕</button>
    </div>
  }
  <router-outlet></router-outlet>
}
