<div class="category-card">
  <div class="card-header">
    <div>
      <h3 class="card-title">Category Breakdown</h3>
      <p class="card-subtitle">Spending distribution across categories</p>
    </div>
    <span class="period-badge">This Month</span>
  </div>

  <div class="breakdown-body">
    <!-- Donut Chart & Center Stats -->
    <div class="donut-container">
      <svg class="donut-svg" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="60" fill="none" stroke="#F1F5F9" stroke-width="18"/>
        <!-- Segment 1: Food & Dining (~25%) -->
        <circle
          cx="80" cy="80" r="60"
          fill="none"
          stroke="#0F172A"
          stroke-width="18"
          stroke-dasharray="94 283"
          stroke-dashoffset="0"
          transform="rotate(-90 80 80)"
        />
        <!-- Segment 2: Shopping (~20%) -->
        <circle
          cx="80" cy="80" r="60"
          fill="none"
          stroke="#1D4ED8"
          stroke-width="18"
          stroke-dasharray="75 302"
          stroke-dashoffset="-94"
          transform="rotate(-90 80 80)"
        />
        <!-- Segment 3: Transportation (~17%) -->
        <circle
          cx="80" cy="80" r="60"
          fill="none"
          stroke="#EA580C"
          stroke-width="18"
          stroke-dasharray="64 313"
          stroke-dashoffset="-169"
          transform="rotate(-90 80 80)"
        />
        <!-- Segment 4: Utilities (~11%) -->
        <circle
          cx="80" cy="80" r="60"
          fill="none"
          stroke="#D97706"
          stroke-width="18"
          stroke-dasharray="42 335"
          stroke-dashoffset="-233"
          transform="rotate(-90 80 80)"
        />
        <!-- Segment 5: Entertainment & Health (~27%) -->
        <circle
          cx="80" cy="80" r="60"
          fill="none"
          stroke="#6366F1"
          stroke-width="18"
          stroke-dasharray="102 275"
          stroke-dashoffset="-275"
          transform="rotate(-90 80 80)"
        />
      </svg>
      <div class="donut-center-label">
        <span class="center-sub">Total Spent</span>
        <span class="center-val">${{ totalAmount() | number:'1.0-0' }}</span>
      </div>
    </div>

    <!-- Category Progress Bars List -->
    <div class="categories-list">
      @for (cat of displayCategories(); track cat.id) {
        <div class="category-row">
          <div class="row-header">
            <div class="cat-left">
              <span class="color-dot" [style.backgroundColor]="cat.color"></span>
              <span class="cat-name">{{ cat.name }}</span>
            </div>
            <div class="cat-right">
              <span class="cat-amt">${{ cat.amount | number:'1.2-2' }}</span>
              <span class="cat-pct">({{ cat.percentage | number:'1.1-1' }}%)</span>
            </div>
          </div>
          <div class="bar-track">
            <div
              class="bar-fill"
              [style.width.%]="cat.percentage"
              [style.backgroundColor]="cat.color"
            ></div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
