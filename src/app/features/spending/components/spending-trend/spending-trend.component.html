<div class="trend-card">
  <div class="card-header">
    <div>
      <h3 class="card-title">Spending Trend</h3>
      <p class="card-subtitle">Trajectory comparing current and preceding monthly periods</p>
    </div>
    <div class="trend-legend">
      <div class="legend-item">
        <span class="legend-line solid-blue"></span>
        <span>This Month</span>
      </div>
      <div class="legend-item">
        <span class="legend-line dashed-gray"></span>
        <span>Last Month</span>
      </div>
    </div>
  </div>

  <div class="chart-wrapper">
    <svg class="trend-svg" viewBox="0 0 540 220" preserveAspectRatio="none">
      <defs>
        <linearGradient id="spendingGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0"/>
        </linearGradient>
      </defs>

      <!-- Horizontal Grid lines -->
      <line x1="50" y1="20" x2="520" y2="20" stroke="#F1F5F9" stroke-width="1"/>
      <text x="40" y="24" text-anchor="end" fill="#94A3B8" font-size="11" font-weight="600">$600</text>

      <line x1="50" y1="70" x2="520" y2="70" stroke="#F1F5F9" stroke-width="1"/>
      <text x="40" y="74" text-anchor="end" fill="#94A3B8" font-size="11" font-weight="600">$400</text>

      <line x1="50" y1="120" x2="520" y2="120" stroke="#F1F5F9" stroke-width="1"/>
      <text x="40" y="124" text-anchor="end" fill="#94A3B8" font-size="11" font-weight="600">$200</text>

      <line x1="50" y1="170" x2="520" y2="170" stroke="#E2E8F0" stroke-width="1"/>
      <text x="40" y="174" text-anchor="end" fill="#94A3B8" font-size="11" font-weight="600">$0</text>

      <!-- Gradient Area Under Curve -->
      <polygon
        points="70,170 70,140 170,95 270,80 370,30 470,55 470,170"
        fill="url(#spendingGradient)"
      />

      <!-- Last Month Dashed Polyline -->
      <polyline
        fill="none"
        stroke="#94A3B8"
        stroke-width="2"
        stroke-dasharray="4 4"
        points="70,130 170,110 270,100 370,85 470,70"
      />
      <circle cx="70" cy="130" r="3.5" fill="#94A3B8"/>
      <circle cx="170" cy="110" r="3.5" fill="#94A3B8"/>
      <circle cx="270" cy="100" r="3.5" fill="#94A3B8"/>
      <circle cx="370" cy="85" r="3.5" fill="#94A3B8"/>
      <circle cx="470" cy="70" r="3.5" fill="#94A3B8"/>

      <!-- This Month Solid Polyline -->
      <polyline
        fill="none"
        stroke="#2563EB"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        points="70,140 170,95 270,80 370,30 470,55"
      />
      <!-- Point markers -->
      <circle cx="70" cy="140" r="4" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="170" cy="95" r="4" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="270" cy="80" r="4" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="370" cy="30" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="470" cy="55" r="4" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>

      <!-- X-Axis Labels -->
      <text x="70" y="195" text-anchor="middle" fill="#64748B" font-size="11" font-weight="600">May 1</text>
      <text x="170" y="195" text-anchor="middle" fill="#64748B" font-size="11" font-weight="600">May 8</text>
      <text x="270" y="195" text-anchor="middle" fill="#64748B" font-size="11" font-weight="600">May 15</text>
      <text x="370" y="195" text-anchor="middle" fill="#64748B" font-size="11" font-weight="600">May 22</text>
      <text x="470" y="195" text-anchor="middle" fill="#64748B" font-size="11" font-weight="600">May 29</text>
    </svg>
  </div>
</div>
