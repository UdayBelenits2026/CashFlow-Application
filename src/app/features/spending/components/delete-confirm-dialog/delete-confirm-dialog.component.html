<div class="modal-backdrop" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <div class="icon-bubble">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <line x1="10" y1="11" x2="10" y2="17"/>
        <line x1="14" y1="11" x2="14" y2="17"/>
      </svg>
    </div>

    <h3 class="dialog-title">Delete Expense?</h3>
    <p class="dialog-message">
      Are you sure you want to delete
      <strong>"{{ expense()?.merchantName }}"</strong>
      for <strong>₹{{ (expense()?.amount || 0) | number:'1.2-2' }}</strong>? This action cannot be undone.
    </p>

    <div class="dialog-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn-delete" (click)="onConfirm()">
        Delete Expense
      </button>
    </div>
  </div>
</div>
