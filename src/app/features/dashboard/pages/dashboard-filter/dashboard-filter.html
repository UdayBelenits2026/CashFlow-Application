<div class="filter-overlay">
  <section class="dashboard-filter">
    <header class="filter-header">
      <div>
        <h2>Filters</h2>
        <p>Apply filters to customize the dashboard data.</p>
      </div>

      <button class="icon-btn" type="button" (click)="close()" aria-label="Close filters">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <div class="filter-grid">
      <div class="field">
        <label for="dateRange">Date Range</label>

        <select
          id="dateRange"
          [value]="filter().dateRange"
          (change)="updateFilter('dateRange', $any($event.target).value)"
        >
          @for (option of dateRanges; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="fromDate">From</label>

        <input
          id="fromDate"
          type="date"
          [value]="filter().fromDate"
          (change)="updateFilter('fromDate', $any($event.target).value)"
        />
      </div>

      <div class="field">
        <label for="toDate">To</label>

        <input
          id="toDate"
          type="date"
          [value]="filter().toDate"
          (change)="updateFilter('toDate', $any($event.target).value)"
        />
      </div>

      <div class="field">
        <label for="quickSelect">Quick Select</label>

        <select
          id="quickSelect"
          [value]="filter().quickSelect"
          (change)="updateFilter('quickSelect', $any($event.target).value)"
        >
          @for (option of quickSelectOptions; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="account">Account</label>

        <select
          id="account"
          [value]="filter().account"
          (change)="updateFilter('account', $any($event.target).value)"
        >
          @for (option of accounts; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="incomeExpense">Income / Expense</label>

        <select
          id="incomeExpense"
          [value]="filter().incomeExpense"
          (change)="updateFilter('incomeExpense', $any($event.target).value)"
        >
          @for (option of incomeExpenseOptions; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="category">Category</label>

        <select
          id="category"
          [value]="filter().category"
          (change)="updateFilter('category', $any($event.target).value)"
        >
          @for (option of categories; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="merchant">Merchant</label>

        <input
          id="merchant"
          type="text"
          placeholder="Search merchant..."
          [value]="filter().merchant"
          (input)="updateFilter('merchant', $any($event.target).value)"
        />
      </div>

      <div class="field amount-range">
        <label>Amount Range</label>

        <div class="amount-inputs">
          <input
            type="number"
            placeholder="Min"
            [value]="filter().minAmount ?? ''"
            (input)="updateFilter('minAmount', $any($event.target).valueAsNumber || null)"
          />

          <span>to</span>

          <input
            type="number"
            placeholder="Max"
            [value]="filter().maxAmount ?? ''"
            (input)="updateFilter('maxAmount', $any($event.target).valueAsNumber || null)"
          />
        </div>
      </div>

      <div class="field">
        <label for="transactionType">Transaction Type</label>

        <select
          id="transactionType"
          [value]="filter().transactionType"
          (change)="updateFilter('transactionType', $any($event.target).value)"
        >
          @for (option of transactionTypes; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="tag">Tags</label>

        <select
          id="tag"
          [value]="filter().tag"
          (change)="updateFilter('tag', $any($event.target).value)"
        >
          @for (option of tags; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="paymentMethod">Payment Method</label>

        <select
          id="paymentMethod"
          [value]="filter().paymentMethod"
          (change)="updateFilter('paymentMethod', $any($event.target).value)"
        >
          @for (option of paymentMethods; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="transactionStatus">Transaction Status</label>

        <select
          id="transactionStatus"
          [value]="filter().transactionStatus"
          (change)="updateFilter('transactionStatus', $any($event.target).value)"
        >
          @for (option of transactionStatuses; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="recurring">Recurring</label>

        <select
          id="recurring"
          [value]="filter().recurring"
          (change)="updateFilter('recurring', $any($event.target).value)"
        >
          @for (option of recurringOptions; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <div class="field">
        <label for="budget">Budget</label>

        <select
          id="budget"
          [value]="filter().budget"
          (change)="updateFilter('budget', $any($event.target).value)"
        >
          @for (option of budgets; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>
    </div>

    <div class="filter-actions">
      <button type="button" class="apply-all-card" (click)="toggleApplyToAll()">
        <div>
          <strong>Apply to all widgets</strong>
          <span>Filters will be applied to all dashboard widgets.</span>
        </div>

        <span class="toggle" [class.active]="filter().applyToAllWidgets">
          <span class="toggle-thumb"></span>
        </span>
      </button>

      <div class="action-buttons">
        <button type="button" class="reset-button" (click)="resetFilters()">Reset</button>

        <button type="button" class="apply-button" (click)="applyFilters()">Apply Filters</button>
      </div>
    </div>

    <footer class="saved-filters">
      <div class="saved-title">
        <strong>Saved Filters</strong>
      </div>

      <div class="saved-filter-list">
        @for (item of savedFilters(); track item) {
          <button type="button" class="saved-filter">
            {{ item }}
          </button>
        }
      </div>

      <button type="button" class="manage-button">Manage Saved Filters →</button>
    </footer>
  </section>
</div>
