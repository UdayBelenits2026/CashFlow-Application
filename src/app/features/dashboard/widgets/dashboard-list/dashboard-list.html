<section class="dashboard-list">
  <article class="list-card">
    <header>
      <h3>{{ title() }}</h3>
    </header>
    @if (isLoading()) {
      <div class="list-skeleton-state" aria-hidden="true">
        <span class="skeleton-line wide"></span>
        <span class="skeleton-line wide"></span>
        <span class="skeleton-line medium"></span>
        <span class="skeleton-line short"></span>
      </div>
    } @else if (hasError()) {
      <div class="list-error-state">
        <div class="error-icon-wrap">
          <fa-icon [icon]="errorIcon"></fa-icon>
        </div>
        <p>We couldn't load your {{ title().toLowerCase() }}.</p>
        <small>Please try again.</small>
        <button class="retry-btn" type="button" (click)="onRetry()">Retry</button>
      </div>
    } @else {
      @for (item of items(); track item.id) {
        <app-cf-transaction-item [item]="item"></app-cf-transaction-item>
      }
      @if (showAddReminder()) {
        <div class="reminder-btn-container">
          <button class="reminder-btn">+ Add Reminder</button>
        </div>
      }
    }
  </article>
</section>
