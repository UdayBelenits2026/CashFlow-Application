<header class="main-navbar">
  <!-- LEFT -->
  <div class="navbar-left">
    <!-- DESKTOP / TABLET MENU -->
    <button type="button" class="menu-button desktop-menu-button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <!-- MOBILE MENU -->
    <button type="button" class="menu-button mobile-menu-button" (click)="toggleMobileMenu()"
      [attr.aria-expanded]="layoutService.isMobileMenuOpen()" aria-label="Toggle navigation menu">
      @if (layoutService.isMobileMenuOpen()) {
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      } @else {
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
      }
    </button>
  </div>
  <!-- RIGHT -->
  <div class="navbar-actions">
    <!-- SEARCH -->
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input type="search" placeholder="Search transactions, accounts, categories..." aria-label="Search" />
    </div>
    <!-- FILTER -->
    <button type="button" class="navbar-control" aria-label="Filter">
      <i class="fa-solid fa-filter" aria-hidden="true"></i>
      <span>
        Filter
      </span>
    </button>
    <!-- CUSTOMIZE -->
    <button type="button" class="navbar-control" aria-label="Customize dashboard">
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
      <span>
        Customize
      </span>
    </button>
    <!-- REFRESH -->
    <button type="button" class="navbar-control" (click)="refresh()" aria-label="Refresh">
      <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
      <span>
        Refresh
      </span>
    </button>
    <!-- EXPORT -->
    <button type="button" class="navbar-control" aria-label="Export">
      <i class="fa-solid fa-download" aria-hidden="true"></i>
      <span>
        Export
      </span>
    </button>
    <!-- NOTIFICATIONS -->
    <button type="button" class="notification-button" aria-label="Notifications">
      <i class="fa-regular fa-bell" aria-hidden="true"></i>
      <span class="notification-badge" aria-label="3 notifications">
        3
      </span>
    </button>
    <!-- PROFILE -->
    <button type="button" class="profile-button" aria-label="Open profile menu">
      <span class="profile-image">
        <img src="/assets/images/profile.png" alt="Profile" />
      </span>
      <span class="profile-name">
        Neelima
      </span>
      <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>
  </div>
</header>
