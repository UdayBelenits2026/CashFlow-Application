<header class="main-navbar">
  <!-- Left side: menu controls and page title -->
  <div class="navbar-left">
    <button
      type="button"
      class="menu-button desktop-menu-button"
      (click)="toggleSidebar()"
      data-tooltip="Toggle sidebar"
      data-tooltip-align="start"
      aria-label="Toggle sidebar"
    >
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <button
      type="button"
      class="menu-button mobile-menu-button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="layoutService.isMobileMenuOpen()"
      data-tooltip="Menu"
      data-tooltip-align="start"
      aria-label="Toggle navigation menu"
    >
      @if (layoutService.isMobileMenuOpen()) {

        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      } @else {

        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      }
    </button>

    <div class="page-title">
      <h1>{{ pageTitle() }}</h1>
    </div>
  </div>

  <!-- Right side: search, date range and actions -->
  <div class="navbar-actions">
    <div class="search-wrapper">
      <button
        type="button"
        class="search-icon-button"
        (click)="toggleSearch()"
        [attr.aria-expanded]="isSearchOpen()"
        data-tooltip="Search"
        aria-label="Search"
      >
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      </button>

      <div class="search-box" [class.search-box--open]="isSearchOpen()">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input
          type="search"
          placeholder="Search transactions, accounts, categories..."
          aria-label="Search transactions, accounts, categories"
          (input)="onSearch($event)"
        />
      </div>
    </div>

    <div class="date-picker-wrapper">
      <app-date-picker
        [selectedDate]="selectedDate"
        (selectedDateChange)="onDateChange($event)"
      />
    </div>

    <button
      type="button"
      class="navbar-control"
      (click)="openFilter()"
      data-tooltip="Filter"
      aria-label="Filter"
    >
      <i class="fa-solid fa-filter" aria-hidden="true"></i>
      <span>Filter</span>
    </button>

    <button
      type="button"
      class="navbar-control"
      (click)="openCustomize()"
      data-tooltip="Customize dashboard"
      aria-label="Customize dashboard"
    >
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
      <span>Customize</span>
    </button>

    <button
      type="button"
      class="navbar-control"
      (click)="refresh()"
      data-tooltip="Refresh dashboard"
      aria-label="Refresh dashboard"
    >
      <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
      <span>Refresh</span>
    </button>

    <button
      type="button"
      class="navbar-control"
      (click)="exportData()"
      data-tooltip="Export"
      aria-label="Export"
    >
      <i class="fa-solid fa-download" aria-hidden="true"></i>
      <span>Export</span>
    </button>

    <button
      type="button"
      class="notification-button"
      (click)="openNotifications()"
      data-tooltip="Notifications"
      data-tooltip-align="end"
      aria-label="Notifications"
    >
      <i class="fa-regular fa-bell" aria-hidden="true"></i>
      <span class="notification-badge" aria-label="3 notifications">3</span>
    </button>

    <div class="profile-menu-wrapper">
      <button
        type="button"
        class="profile-button"
        (click)="toggleProfileMenu()"
        [attr.aria-expanded]="isProfileMenuOpen()"
        aria-haspopup="menu"
        aria-label="Open profile menu"
      >
        <span class="profile-image">
          <img
            src="/assets/images/profile.png"
            alt="Profile"
          />
        </span>
        <span class="profile-name">Neelima</span>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>

      @if (isProfileMenuOpen()) {
        <div class="profile-menu" role="menu">
          <button type="button" class="profile-menu-item" role="menuitem" (click)="goToProfile()">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <span>Profile</span>
          </button>
          <button type="button" class="profile-menu-item" role="menuitem" (click)="goToSettings()">
            <i class="fa-solid fa-gear" aria-hidden="true"></i>
            <span>Settings</span>
          </button>
          <button
            type="button"
            class="profile-menu-item profile-menu-item--danger"
            role="menuitem"
            (click)="logout()"
          >
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>

@if (isProfileMenuOpen() || isSearchOpen()) {
  <button
    type="button"
    class="navbar-backdrop"
    aria-label="Close menu"
    (click)="closeMenus()"
  ></button>
}
