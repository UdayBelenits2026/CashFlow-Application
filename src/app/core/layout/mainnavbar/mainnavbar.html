<header class="main-navbar">
  <!-- Left side: menu controls and page title -->
  <div class="navbar-left">
    <button
      type="button"
      class="menu-button desktop-menu-button"
      (click)="toggleSidebar()"
      aria-label="Toggle sidebar"
    >
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <button
      type="button"
      class="menu-button mobile-menu-button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="layoutService.isMobileMenuOpen()"
      aria-label="Toggle navigation menu"
    >
      @if (layoutService.isMobileMenuOpen()) {
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      } @else {
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      }
    </button>

    <div class="page-title">
      <h1>Dashboard</h1>
    </div>
  </div>

  <!-- Right side: search, date range and actions -->
  <div class="navbar-actions">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input
        type="search"
        placeholder="Search transactions, accounts, categories..."
        aria-label="Search transactions, accounts, categories"
        (input)="onSearch($event)"
      />
    </div>

    <div class="date-picker-wrapper">
      <app-date-picker [selectedDate]="selectedDate" (selectedDateChange)="onDateChange($event)" />
    </div>

    <button
      type="button"
      class="navbar-control"
      [class.active]="layoutService.isFilterOpen()"
      (click)="toggleFilter()"
      aria-label="Filter"
    >
      <i class="fa-solid fa-filter" aria-hidden="true"></i>
      <span>Filter</span>
    </button>

    <button
      type="button"
      class="navbar-control"
      [class.active]="isCustomizeActive"
      (click)="openCustomize()"
      aria-label="Customize dashboard"
    >
      <i class="fa-solid fa-gear" aria-hidden="true"></i>
      <span>Customize</span>
    </button>

    <button type="button" class="navbar-control" (click)="refresh()" aria-label="Refresh dashboard">
      <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
      <span>Refresh</span>
    </button>

    <button type="button" class="navbar-control" (click)="exportData()" aria-label="Export">
      <i class="fa-solid fa-download" aria-hidden="true"></i>
      <span>Export</span>
    </button>

    <button
      type="button"
      class="notification-button"
      (click)="openNotifications()"
      aria-label="Notifications"
    >
      <i class="fa-regular fa-bell" aria-hidden="true"></i>
      <span class="notification-badge" aria-label="3 notifications">3</span>
    </button>

    <button
      type="button"
      class="profile-button"
      (click)="openProfile()"
      aria-label="Open profile menu"
    >
      <span class="profile-image">
        <img src="/assets/images/profile.png" alt="Profile" />
      </span>
      <span class="profile-name">Neelima</span>
      <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>
  </div>
</header>
