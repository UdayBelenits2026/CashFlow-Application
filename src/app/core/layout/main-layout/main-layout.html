<div class="app-layout" [class.sidebar-collapsed]="layoutService.isSidebarCollapsed()">
  <app-cf-sidenavbar />
  <div class="app-content">
    <app-cf-mainnavbar />
    <main class="page-content">
      <router-outlet />
    </main>
  </div>
  <app-cf-dashboard-filter
    [isOpen]="layoutService.isFilterOpen()"
    (closeModal)="layoutService.closeFilter()"
    (applyFilter)="onApplyFilter($event)"
  ></app-cf-dashboard-filter>
</div>
